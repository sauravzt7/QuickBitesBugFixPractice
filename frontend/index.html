<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>QuickBites</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">● QuickBites</div>
    <nav id="nav" class="hidden">
      <button class="link" data-view="menu">Menu</button>
      <button class="link" data-view="orders">Orders</button>
      <span id="userName" class="muted"></span>
      <button class="link" id="logoutBtn">Log out</button>
    </nav>
  </header>

  <main>
    <section id="loginView" class="card narrow">
      <h1>Sign in</h1>
      <form id="loginForm">
        <label>Email <input name="email" type="email" value="alex.morgan@quickbites.com" required></label>
        <label>Password <input name="password" type="password" value="password123" required></label>
        <button class="primary" type="submit">Log in</button>
        <p id="loginError" class="error"></p>
      </form>
    </section>

    <section id="menuView" class="hidden layout">
      <div id="restaurants" class="restaurants"></div>
      <aside class="card cart">
        <h2>Your Cart</h2>
        <div id="cartItems"></div>
        <div id="cartTotals" class="totals"></div>
        <button id="checkoutBtn" class="primary" disabled>Proceed to Checkout</button>
        <button id="clearCartBtn" class="link small">Clear Cart</button>
      </aside>
    </section>

    <section id="checkoutView" class="hidden layout">
      <div class="card">
        <h2>Payment</h2>
        <form id="checkoutForm">
          <label>Cardholder Name <input name="cardholderName" value="Sample User" required></label>
          <label>Card Number <input name="cardNumber" value="4242424242424242" required></label>
          <div class="row">
            <label>Expiry Month <input name="expiryMonth" type="number" value="12" required></label>
            <label>Expiry Year <input name="expiryYear" type="number" value="2050" required></label>
            <label>CVV <input name="cvv" value="123" required></label>
          </div>
          <button class="primary" type="submit">Place Order</button>
          <button class="link" type="button" data-view="menu">Back to menu</button>
          <p id="checkoutError" class="error"></p>
        </form>
      </div>
      <aside class="card cart">
        <h2>Order Summary</h2>
        <div id="summaryItems"></div>
        <div id="summaryTotals" class="totals"></div>
      </aside>
    </section>

    <section id="ordersView" class="hidden">
      <h1>Your Orders</h1>
      <p id="ordersCount" class="muted"></p>
      <div id="orders" class="orders"></div>
    </section>
  </main>

  <script src="/app.js"></script>
</body>
</html>
